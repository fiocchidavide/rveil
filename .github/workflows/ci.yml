name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install rclone age zstd openssl@3 shellcheck

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd shellcheck
          curl -fsSL https://rclone.org/install.sh | sudo bash
          # age's release ships age-plugin-batchpass, for the stock-recovery test.
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age.tar.gz" | sha256sum -c
          sudo tar -xzf /tmp/age.tar.gz -C /usr/local/bin --strip-components=1

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Shellcheck
        run: shellcheck share/open.sh scripts/render-open.sh
